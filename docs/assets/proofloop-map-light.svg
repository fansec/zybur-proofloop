<polyline points="-3.5,-5 3,0 -3.5,5" transform="translate(575,410) rotate(180)" fill="none" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="-3.5,-5 3,0 -3.5,5" transform="translate(325,410) rotate(180)" fill="none" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="-3.5,-5 3,0 -3.5,5" transform="translate(110,320) rotate(270)" fill="none" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="200" cy="230" r="24" fill="#0d9488" stroke="#ffffff" stroke-width="4"/>
<text x="200" y="236.5" font-size="19" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="200" y="140" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">Pick</text>
<text x="200" y="165" font-size="15" text-anchor="middle" fill="#475569">Untested and overdue</text>
<text x="200" y="185" font-size="15" text-anchor="middle" fill="#475569">rules go first</text>
<circle cx="450" cy="230" r="24" fill="#0d9488" stroke="#ffffff" stroke-width="4"/>
<text x="450" y="236.5" font-size="19" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="450" y="140" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">Attack</text>
<text x="450" y="165" font-size="15" text-anchor="middle" fill="#475569">A real technique runs on</text>
<text x="450" y="185" font-size="15" text-anchor="middle" fill="#475569">a lab machine you own</text>
<circle cx="700" cy="230" r="24" fill="#0d9488" stroke="#ffffff" stroke-width="4"/>
<text x="700" y="236.5" font-size="19" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="700" y="140" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">Wait</text>
<text x="700" y="165" font-size="15" text-anchor="middle" fill="#475569">Until the rule has had</text>
<text x="700" y="185" font-size="15" text-anchor="middle" fill="#475569">its turn to run</text>
<circle cx="700" cy="410" r="24" fill="#0d9488" stroke="#ffffff" stroke-width="4"/>
<text x="700" y="416.5" font-size="19" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<text x="700" y="478" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">Ask</text>
<text x="700" y="503" font-size="15" text-anchor="middle" fill="#475569">Is the alert there, on that</text>
<text x="700" y="523" font-size="15" text-anchor="middle" fill="#475569">machine, in that window?</text>
<circle cx="450" cy="410" r="24" fill="#0d9488" stroke="#ffffff" stroke-width="4"/>
<text x="450" y="416.5" font-size="19" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<text x="450" y="478" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">Judge</text>
<text x="450" y="503" font-size="15" text-anchor="middle" fill="#475569">Fixed rules decide,</text>
<text x="450" y="523" font-size="15" text-anchor="middle" fill="#475569">never a guess or a model</text>
<circle cx="200" cy="410" r="24" fill="#0d9488" stroke="#ffffff" stroke-width="4"/>
<text x="200" y="416.5" font-size="19" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
<text x="200" y="478" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">Record</text>
<text x="200" y="503" font-size="15" text-anchor="middle" fill="#475569">Kept in a ledger that is</text>
<text x="200" y="523" font-size="15" text-anchor="middle" fill="#475569">only ever added to</text>
<text x="450" y="287" font-size="12.5" font-weight="700" letter-spacing="1.6" text-anchor="middle" fill="#0f766e">EVERY NIGHT</text>
<text x="450" y="319" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">Did the alert really fire?</text>
<rect x="224.5" y="337" width="106" height="28" rx="14" fill="#ffffff" stroke="#d5e3e1"/>
<circle cx="241.5" cy="351" r="4.5" fill="#0d9488"/>
<text x="253.5" y="355.6" font-size="13.5" font-weight="600" fill="#1e293b">Detected</text>
<rect x="340.5" y="337" width="113" height="28" rx="14" fill="#ffffff" stroke="#d5e3e1"/>
<circle cx="357.5" cy="351" r="4.5" fill="#3b82f6"/>
<text x="369.5" y="355.6" font-size="13.5" font-weight="600" fill="#1e293b">Prevented</text>
<rect x="463.5" y="337" width="93" height="28" rx="14" fill="#ffffff" stroke="#d5e3e1"/>
<circle cx="480.5" cy="351" r="4.5" fill="#dc2626"/>
<text x="492.5" y="355.6" font-size="13.5" font-weight="600" fill="#1e293b">Missed</text>
<rect x="566.5" y="337" width="109" height="28" rx="14" fill="#ffffff" stroke="#d5e3e1"/>
<circle cx="583.5" cy="351" r="4.5" fill="#94a3b8"/>
<text x="595.5" y="355.6" font-size="13.5" font-weight="600" fill="#1e293b">Unproven</text>
<line x1="48" y1="566" x2="852" y2="566" stroke="#e2e8f0"/>
<text x="450" y="595" font-size="14" text-anchor="middle" fill="#64748b">A miss is checked again the next night. A rule that has not had its turn is pending, never missed.</text>
</svg>
