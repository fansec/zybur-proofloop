<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="t">How Zybur Proofloop works: one night, six steps</title>
<desc id="d">Six steps on a loop, repeated every night. 1 Pick: untested and overdue rules go first. 2 Attack: a real technique runs on a lab machine you own. 3 Wait: until the rule has had its turn to run. 4 Ask: is the alert there, on that machine, in that window? 5 Judge: fixed rules decide, never a guess or a model. 6 Record: kept in a ledger that is only ever added to. Each run ends as detected, prevented, missed or unproven. A miss is checked again the next night.</desc>
<rect x="0.5" y="0.5" width="899" height="619" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
<text x="48" y="52" font-size="13" font-weight="700" letter-spacing="1.5" fill="#0f766e">ZYBUR PROOFLOOP</text>
<text x="852" y="52" font-size="14" text-anchor="end" fill="#64748b">One night, six steps</text>
<path d="M200,230 H700 A90,90 0 0 1 700,410 H200 A90,90 0 0 1 200,230 Z" fill="#f5fdfb" stroke="#ccfbf1" stroke-width="12"/>
<polyline points="-3.5,-5 3,0 -3.5,5" transform="translate(325,230) rotate(0)" fill="none" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="-3.5,-5 3,0 -3.5,5" transform="translate(575,230) rotate(0)" fill="none" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
